apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsa-api
  namespace: lecturer-support-agent
spec:
  replicas: 2
  selector:
    matchLabels: {app: lsa-api}
  template:
    metadata:
      labels: {app: lsa-api}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: lecturer-support-agent/api:2.3.0
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: lsa-config}
            - secretRef: {name: lsa-secrets}
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: runtime-tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: lsa-api
  namespace: lecturer-support-agent
spec:
  selector: {app: lsa-api}
  ports: [{port: 8000, targetPort: 8000}]
