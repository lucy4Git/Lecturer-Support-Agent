[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lecturer-support-agent"
version = "2.5.0"
description = "Commercial Lecturer Support Agent with enterprise integration contracts, account-security completion, real-data rights governance, evaluation capture, backup execution, and release-readiness controls."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - see LICENSE.md"}
dependencies = [
  "argon2-cffi>=23.1,<26",   "alembic>=1.14,<2", "boto3>=1.35,<2", "fastapi>=0.115,<1",
  "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "pydantic>=2.10,<3",
  "cryptography>=43,<47", "email-validator>=2.2,<3",
  "pydantic-settings>=2.7,<3", "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.18,<1", "redis>=5,<7", "sqlalchemy>=2.0.36,<2.1",
  "beautifulsoup4>=4.12,<5", "charset-normalizer>=3.4,<4",
  "openpyxl>=3.1,<4", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.30,<1"
]
[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "mypy>=1.14,<2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<1", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
[tool.hatch.build.targets.wheel]
packages = ["services"]
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires local infrastructure", "security: security and isolation validation", "slow: test may take > 30s (e.g. LLM generation)"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["services/database/migrations"]
