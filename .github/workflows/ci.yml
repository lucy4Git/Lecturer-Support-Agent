name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q services scripts tests
      - run: python -m pytest tests/unit -q
      - run: python scripts/validation/scan_repository_secrets.py
      - name: Run cumulative release validators
        run: |
          python scripts/validation/validate_data_foundation.py
          python scripts/validation/validate_multi_provider_pack.py
          for script in scripts/validation/validate_v13_foundation.py \
            scripts/validation/validate_v14_release.py \
            scripts/validation/validate_v15_release.py \
            scripts/validation/validate_v16_release.py \
            scripts/validation/validate_v17_release.py \
            scripts/validation/validate_v18_release.py \
            scripts/validation/validate_v19_release.py \
            scripts/validation/validate_v20_release.py \
            scripts/validation/validate_v21_release.py \
            scripts/validation/validate_v22_release.py \
            scripts/validation/validate_v23_release.py \
            scripts/validation/validate_v24_release.py \
            scripts/validation/validate_v25_completion.py \
            scripts/validation/validate_v26_deployment.py; do python "$script"; done
          python scripts/data/validate_institution_onboarding.py data/manifests/example_institution_onboarding_package.json
      - name: Validate deployment descriptors
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          yaml.safe_load(Path('render.yaml').read_text())
          yaml.safe_load(Path('render.production.yaml').read_text())
          json.loads(Path('apps/web/vercel.json').read_text())
          print('Deployment descriptors parsed successfully.')
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t lsa-api:test .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t lsa-worker:test .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t lsa-web:test .
      - run: docker build -f infrastructure/docker/clamav.Dockerfile -t lsa-clamav:test .
