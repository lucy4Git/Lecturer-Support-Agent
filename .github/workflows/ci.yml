name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q services scripts tests
      - run: python -m pytest tests/unit -q
      - run: python scripts/validation/scan_repository_secrets.py
      - run: python scripts/validation/validate_v23_release.py
      - run: python scripts/data/validate_institution_onboarding.py data/manifests/example_institution_onboarding_package.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t lsa-api:test .
      - run: docker build -f infrastructure/docker/worker.Dockerfile -t lsa-worker:test .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t lsa-web:test .
