name: Static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run cumulative static validators and unit tests
        run: |
          python scripts/validation/validate_data_foundation.py
          python scripts/validation/validate_multi_provider_pack.py
          python scripts/validation/validate_v13_foundation.py
          python scripts/validation/validate_v14_release.py
          python scripts/validation/validate_v15_release.py
          python scripts/validation/validate_v16_release.py
          python scripts/validation/validate_v17_release.py
          python scripts/validation/validate_v18_release.py
          python scripts/validation/validate_v19_release.py
          python scripts/validation/validate_v20_release.py
          python scripts/validation/validate_v21_release.py
          python scripts/validation/validate_v22_release.py
          python scripts/validation/validate_v23_release.py
          python scripts/data/validate_institution_onboarding.py data/manifests/example_institution_onboarding_package.json
          python -m pytest tests/unit -q
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Type-check and build web application
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build
