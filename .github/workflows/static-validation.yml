name: Deployment release gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "render*.yaml"
      - "apps/web/**"
      - "infrastructure/docker/**"
      - "scripts/deployment/**"
      - "services/database/migrations/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Verify migration chain head
        run: |
          python - <<'PY'
          from pathlib import Path
          head=Path('services/database/migrations/versions/20260803_0012_v26_deployment_completion.py')
          assert head.exists()
          assert 'down_revision: str | None = "20260726_0011"' in head.read_text()
          print('Migration chain head is 20260803_0012.')
          PY
      - name: Validate v2.6 deployment completion
        run: python scripts/validation/validate_v26_deployment.py
      - name: Safe package dry run
        run: python scripts/deployment/create_safe_release.py --root . --output /tmp/lsa-safe.zip
      - name: Secret scan
        run: python scripts/validation/scan_repository_secrets.py
